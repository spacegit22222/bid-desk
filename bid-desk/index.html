<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Bid Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: two doors on the home screen. Upload leads to an eligibility traffic light; Review leads to bids, then phases, then tasks. Source pages open in a side drawer with the line highlighted. */
:root{
  --paper:#F3F5F8; --panel:#FFFFFF; --ink:#142030; --muted:#5A6577; --line:#D8DEE6; --soft:#E9EDF3;
  --accent:#2C4AA6; --accent-ink:#FFFFFF; --stamp:#A8321F;
  --go:#1E8549; --go-bg:#E3F3E9; --hold:#B37800; --hold-bg:#FBF0D6; --stop:#BD3A2A; --stop-bg:#FBE5E1;
  --mark:rgba(255,205,0,.42); --mark-edge:#E2A800;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E141B; --panel:#161F29; --ink:#E5E9EF; --muted:#9AA5B4; --line:#2A3543; --soft:#1D2733;
  --accent:#8FA7F2; --accent-ink:#0E141B; --stamp:#F08770;
  --go:#53C483; --go-bg:#173326; --hold:#E9B53C; --hold-bg:#3A2E12; --stop:#F2705F; --stop-bg:#3D1C18;
  --mark:rgba(255,205,0,.38); --mark-edge:#E9B53C; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E141B; --panel:#161F29; --ink:#E5E9EF; --muted:#9AA5B4; --line:#2A3543; --soft:#1D2733;
  --accent:#8FA7F2; --accent-ink:#0E141B; --stamp:#F08770;
  --go:#53C483; --go-bg:#173326; --hold:#E9B53C; --hold-bg:#3A2E12; --stop:#F2705F; --stop-bg:#3D1C18;
  --mark:rgba(255,205,0,.38); --mark-edge:#E9B53C; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--f-body);padding-inline:16px;padding-block:0 48px}
a{color:var(--accent)}
.wrap{max-width:1040px;margin:0 auto}
h1,h2,h3{text-wrap:balance;margin:0}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.s{font-size:13px}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding-block:16px;border-bottom:1px solid var(--line)}
.brand{border:0;background:none;padding:0;font-weight:800;font-size:18px;letter-spacing:-.01em}
.who{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.who input{width:150px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.btn{border:1px solid var(--line);background:var(--panel);padding:9px 14px;border-radius:6px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:5px 10px;font-size:12px}
.back{border:0;background:none;color:var(--accent);font-weight:600;padding:0;margin-block:20px 12px;font-size:14px}
main{padding-top:8px}

/* home */
.doors{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:48px}
.door{display:grid;gap:10px;align-content:start;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:32px 28px;min-height:220px;transition:border-color .15s,transform .15s}
.door:hover{border-color:var(--accent);transform:translateY(-2px)}
.door .ico{width:48px;height:48px;border-radius:12px;background:var(--soft);display:grid;place-items:center;color:var(--accent)}
.door b{font-size:24px;font-weight:800;letter-spacing:-.01em}
.door span{color:var(--muted)}
.door em{font-style:normal;font-family:var(--f-mono);font-size:12px;color:var(--accent);margin-top:auto}
@media (max-width:700px){.doors{grid-template-columns:1fr;margin-top:24px}.door{min-height:0}}
.home-note{margin-top:22px;text-align:center}

/* upload */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px}
.drop{display:grid;place-items:center;gap:8px;text-align:center;border:2px dashed var(--line);border-radius:12px;padding:36px 16px;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--accent)}
.drop b{font-size:18px}
textarea{width:100%;min-height:72px;border:1px solid var(--line);border-radius:6px;padding:10px;background:var(--panel);resize:vertical}
.stack{display:grid;gap:16px}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.steps li{display:flex;gap:10px;align-items:center;color:var(--muted)}
.steps .tick{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none}
.steps li.on{color:var(--ink)}
.steps li.on .tick{border-color:var(--accent);border-top-color:transparent;animation:spin .8s linear infinite}
.steps li.done{color:var(--ink)}
.steps li.done .tick{border-color:var(--go);background:var(--go)}
@keyframes spin{to{transform:rotate(360deg)}}

/* verdict */
.verdict{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center}
.lamp{display:grid;gap:8px;padding:10px;background:#1A2230;border:1px solid var(--line);border-radius:26px}
.lamp i{width:30px;height:30px;border-radius:50%;background:#5A6577;opacity:.3;display:block}
.lamp i.red.on{background:#F2584A;opacity:1;box-shadow:0 0 16px #F2584A}
.lamp i.amber.on{background:#F4B42A;opacity:1;box-shadow:0 0 16px #F4B42A}
.lamp i.green.on{background:#3CC36F;opacity:1;box-shadow:0 0 16px #3CC36F}
.verdict h2{font-size:26px;line-height:1.2}
.verdict p{margin:8px 0 0;max-width:66ch;color:var(--muted)}
.tally{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:13px}
.tally span{display:flex;align-items:center;gap:6px}

.list{display:grid;gap:8px}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.row > div{min-width:0}
.row .t{font-weight:600}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.dot.green{background:var(--go)}.dot.amber{background:var(--hold)}.dot.red{background:var(--stop)}
.ref{font-family:var(--f-mono);font-size:12px;font-weight:500;border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:4px;padding:2px 7px}
.ref:hover{background:var(--accent);color:var(--accent-ink)}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
@media (max-width:640px){.row{grid-template-columns:auto 1fr}.row .acts{grid-column:1/-1;justify-content:flex-start}}
.section-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin:26px 0 10px}

/* bids + phases */
.bidcard{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;text-align:left;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
.bidcard:hover{border-color:var(--accent)}
.bidcard > div{min-width:0}
.stamp{border:2px solid var(--stamp);color:var(--stamp);font-family:var(--f-mono);font-weight:500;font-size:13px;padding:6px 10px;border-radius:4px;transform:rotate(-2deg);white-space:nowrap}
.bidhead{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;margin-bottom:18px}
.bidhead > div{min-width:0}
.bidhead h1{font-size:21px;line-height:1.25}
.clock{text-align:right}
.clock b{font-family:var(--f-mono);font-size:24px;font-weight:500}
@media (max-width:700px){.bidcard,.bidhead{grid-template-columns:1fr}.clock{text-align:left}.stamp{justify-self:start}}
.phases{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:820px){.phases{grid-template-columns:repeat(2,1fr)}}
@media (max-width:480px){.phases{grid-template-columns:1fr}}
.phase{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.phase:hover{border-color:var(--accent)}
.phase[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.phase > div{min-width:0}
.phase b{font-size:16px;display:block}
.ring{width:58px;height:58px;position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font:500 13px var(--f-mono)}
.overall{display:flex;align-items:center;gap:12px}
.meter{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;flex:1;min-width:120px}
.meter b{display:block;height:100%;background:var(--go);transition:width .4s}

.task{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.task > div{min-width:0}
.task input[type=checkbox]{width:20px;height:20px;margin-top:2px;accent-color:var(--go);cursor:pointer}
.task.done .t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.task .t{font-weight:600}
.meta{display:flex;gap:4px 12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:2px}
.signed{color:var(--go);font-weight:600}
.msg{margin-top:10px;background:var(--soft);border-radius:6px;padding:12px;font-size:13px;white-space:pre-wrap}
.score{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.score .card{padding:16px}
.score b{font-family:var(--f-mono);font-size:28px;font-weight:500}
.bar70{position:relative;height:10px;background:var(--soft);border-radius:5px;margin-top:8px}
.bar70 i{position:absolute;inset:0 auto 0 0;border-radius:5px}
.bar70 u{position:absolute;top:-4px;bottom:-4px;left:70%;width:2px;background:var(--ink)}
@media (max-width:560px){.score{grid-template-columns:1fr}}

/* drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--panel);border-left:1px solid var(--line);box-shadow:-12px 0 30px rgba(0,0,0,.18);display:flex;flex-direction:column;z-index:20;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer header{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.drawer .q{padding:10px 16px;font-size:13px;background:var(--soft);border-bottom:1px solid var(--line)}
.drawer .q mark{background:var(--mark);color:inherit;padding:0 2px}
.pagebox{flex:1;overflow:auto;padding:16px;background:var(--soft)}
.pagewrap{position:relative;margin:0 auto;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.2)}
.pagewrap canvas,.pagewrap img{display:block;width:100%;height:auto}
.hl{position:absolute;background:var(--mark);outline:2px solid var(--mark-edge);border-radius:2px;animation:pulse 1.6s ease-in-out 2}
@keyframes pulse{50%{outline-width:5px}}
.drawer footer{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.risk{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;margin-left:8px;vertical-align:1px}
.val{font-size:13px;margin-top:2px}
.ask{margin-bottom:18px}
.askrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.askrow input{flex:1;min-width:200px;padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:4px 10px;font-size:12px}
.chip:hover{border-color:var(--accent)}
.answer{margin-top:12px;border-top:1px solid var(--line);padding-top:12px;display:grid;gap:8px}
.answer .warn{background:var(--hold-bg);border-radius:6px;padding:8px 10px;font-size:13px}
.board{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px;margin-top:4px}
.col{background:var(--soft);border-radius:10px;padding:10px;display:grid;gap:8px;align-content:start;min-height:200px}
.colh{display:flex;justify-content:space-between;align-items:center;padding:2px 4px}
.kcard{display:grid;gap:2px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.kcard:hover{border-color:var(--accent)}
.kcard.urgent{border-left:3px solid var(--stop)}
.kref{font-size:11px;color:var(--stamp)}
.kt{font-weight:600;font-size:14px;line-height:1.3}
.kfoot{display:flex;justify-content:space-between;gap:8px;margin-top:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:4px 10px;font-size:12px;font-weight:600}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.tag{font-size:11px;font-weight:600;border:1px solid var(--line);border-radius:4px;padding:2px 6px;color:var(--muted);white-space:nowrap}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
select{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.msg .warn{background:var(--hold-bg);border-radius:6px;padding:8px 10px;font-size:13px}
.warn{background:var(--hold-bg);border-radius:6px;padding:8px 10px;font-size:13px}
.linkish{background:none;border:0;padding:0;text-align:left;color:var(--ink);font-weight:600}
.linkish:hover{color:var(--accent);text-decoration:underline}
.libtext{white-space:pre-wrap;font-size:14px;margin-top:6px;line-height:1.55}
textarea.libedit{min-height:260px}
textarea.sect{width:100%;min-height:200px;border:1px solid var(--line);border-radius:6px;padding:10px;background:var(--panel);font-size:14px;line-height:1.5}
.msg.plain{white-space:normal}
.btn.danger{color:var(--stop);border-color:var(--stop)}
.checks{display:grid;gap:6px}
.chk{display:flex;gap:8px;align-items:baseline;font-size:13px}
.chk .dot{display:inline-block;flex:none;position:relative;top:1px}
.pricebox{margin-top:8px}
.ptwrap{overflow-x:auto;margin-top:10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.ptable{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;min-width:680px}
.ptable th,.ptable td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
.ptable th[scope=row],.ptable thead th:first-child{text-align:left;min-width:170px;position:sticky;left:0;background:var(--panel);z-index:1;box-shadow:1px 0 0 var(--line)}
.ptable thead th:first-child,.ptable tfoot th{background:var(--soft)}
@media (max-width:600px){.ptable th[scope=row],.ptable thead th:first-child{min-width:120px;max-width:140px;font-size:12px}}
.ptable thead th{font-size:12px;font-weight:600;background:var(--soft)}
.ptable .rate{font-weight:400;color:var(--muted);margin-top:4px;white-space:nowrap}
.ptable .miss{color:var(--stop)}
.ptable tfoot th,.ptable tfoot td{border-bottom:0;background:var(--soft)}
input.num{border:1px solid var(--line);border-radius:4px;padding:3px 5px;text-align:right;background:var(--panel);font-family:var(--f-mono);font-size:13px}
.psum{display:none;margin-top:8px}
.psrow{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:4px 0;border-bottom:1px solid var(--line)}
@media (max-width:600px){.psum{display:block}}
details.exp{margin-top:10px}
details.exp summary{cursor:pointer;font-weight:600}
.exrow{display:flex;gap:6px;margin-top:6px;align-items:center}
.exrow input[type=text]:not(.num){flex:1;min-width:0;border:1px solid var(--line);border-radius:4px;padding:4px 6px;background:var(--panel)}
.tplrow{border-top:1px solid var(--line);margin-top:12px;padding-top:10px;display:grid;gap:6px}
.maptbl{display:grid;gap:4px;margin-top:4px}
.maprow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center}
.maprow select{width:100%;font-size:13px;padding:4px 6px}
.miss{color:var(--stop)}
@media (max-width:600px){.maprow{grid-template-columns:1fr}.maprow>span.muted{display:none}}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tag.tg{color:var(--go);border-color:var(--go);margin-left:6px;font-size:10px;padding:1px 5px}
.tag.tt{margin-left:6px;font-size:10px;padding:1px 5px}
.cnt.over{color:var(--stop);font-weight:600}
.lfwrap{display:grid;gap:12px;margin-top:10px}
.lflvl{display:grid;gap:4px}
.lfout{border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:6px;background:var(--panel)}
.lfoutput{border-left:3px solid var(--soft);padding-left:10px;display:grid;gap:6px;margin-top:4px}
input.lfi{border:1px solid var(--line);border-radius:4px;padding:5px 7px;background:var(--panel);font-size:13px;min-width:0;width:100%}
input.lfi.wide{font-weight:600}
.lfind{display:grid;gap:4px}
.lfh,.lfrow{display:grid;grid-template-columns:2fr 1fr 1.2fr 1.4fr 32px;gap:6px;align-items:center}
.lfh{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
textarea.lfas{min-height:70px;font-size:13px}
.linkish.add{color:var(--accent);font-weight:500;justify-self:start}
@media (max-width:700px){.lfh{display:none}.lfrow{grid-template-columns:1fr 1fr;border-bottom:1px dashed var(--line);padding-bottom:6px}.lfrow input:first-child{grid-column:1/-1}}
.btable{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;min-width:640px}
.btable th,.btable td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
.btable td:first-child,.btable th:first-child{text-align:left}
.btable thead th{background:var(--soft);font-size:12px}
.btable tr.cat th{text-align:left;background:var(--soft);font-size:12px;padding-top:8px}
.btable tr.cat td{background:var(--soft)}
.btable tr.bad td{background:var(--stop-bg)}
.btable tr.warnrow td{background:var(--hold-bg)}
.btable tr.addrow td{border-bottom:0;text-align:left}
.btable tfoot th,.btable tfoot td{background:var(--soft);text-align:right}
.btable tfoot th{text-align:left}
input.tx{border:1px solid var(--line);border-radius:4px;padding:3px 5px;background:var(--panel);font-size:13px;width:100%;min-width:60px}
.fin{margin-top:10px;display:grid;gap:6px}
.finrow{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.3fr) auto auto;gap:6px;align-items:center}
.finrow select{font-size:13px;padding:4px}
.finsum{display:flex;gap:18px;flex-wrap:wrap;margin-top:4px}
.finsum>div{display:flex;gap:8px;align-items:baseline}
@media (max-width:600px){.finrow{grid-template-columns:minmax(0,1fr) 90px 32px}.finrow input.tx{grid-column:1/-1}}
@media (max-width:700px){.lfrow{grid-template-columns:1fr 1fr 32px}.lfrow input:nth-child(4){grid-column:1/3}}
.facts{display:grid;gap:6px;margin-top:8px}
.factrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) minmax(0,.9fr) 32px;gap:6px;align-items:center}
@media (max-width:600px){.factrow{grid-template-columns:1fr 32px}.factrow input:first-child{grid-column:1/-1}.factrow span{grid-column:1/-1}}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:12px}
.tiles .card{padding:16px}
.tiles b{font-family:var(--f-mono);font-size:26px;font-weight:500;display:block}
@media (max-width:700px){.tiles{grid-template-columns:1fr 1fr}}

function lite(id,ref,buyer,title,closes,label,stage,lead,phaseDone,mode){

// Find which text items on a page contain a quote. Returns array of item indices, or null.
function normText(s) {
  return s.replace(/[‘’‚′]/g, "'").replace(/[“”„]/g, '"')
    .replace(/[‐-―−]/g, "-").replace(/\s+/g, "").toLowerCase();
}
function findQuoteItems(items, quote) {
  const target = normText(quote);
  if (!target) return null;
  let full = ""; const owner = [];
  items.forEach((it, i) => { const n = normText(it.str || ""); for (let k = 0; k < n.length; k++) owner.push(i); full += n; });
  let at = full.indexOf(target);
  let len = target.length;
  if (at < 0) { // fall back to the longest prefix of at least 24 chars
    for (let L = target.length - 1; L >= 24; L--) { at = full.indexOf(target.slice(0, L)); if (at >= 0) { len = L; break; } }
  }
  if (at < 0) return null;
  const set = new Set(); for (let k = at; k < at + len; k++) set.add(owner[k]);
  return [...set];
}
